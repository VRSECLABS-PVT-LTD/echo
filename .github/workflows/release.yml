name: Release

# Builds installers for macOS (.dmg), Windows (.exe) and Linux (.AppImage, .deb)
# when a version tag like v0.1.0 is pushed, and attaches them to a draft GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installers
        run: npx electron-builder --publish never
        env:
          # Unsigned builds by default. Add Apple / Windows signing secrets here when available.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # macOS uses ad-hoc signing (identity "-") until a Developer ID is added
      - name: Checksums
        shell: bash
        run: |
          cd dist
          SUM="sha256sum"; command -v sha256sum >/dev/null || SUM="shasum -a 256"
          find . -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -exec $SUM {} \; > SHA256SUMS-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: echo-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*
